aid: season
name: Season Health
description: >-
  Season Health is a food-as-medicine platform that helps people living with
  chronic conditions eat well and live well. It connects patients with
  registered dietitians, personalized nutrition and meal plans, and
  medically-tailored groceries and meals, and works with health plans and
  care providers to deliver nutrition care as a covered benefit. The consumer
  and provider experiences run through app.seasonhealth.com; the company is a
  HIPAA-covered digital health service. Season Health is backed by a16z. As of
  this enrichment pass the company publishes no public developer API,
  documentation, or SDKs — api.seasonhealth.com is a private application
  backend — so this profile captures the company's real public web properties
  rather than an API program.
